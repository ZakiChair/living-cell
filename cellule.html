<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La cellule — modélisation interactive</title>
    <!-- Favicon en ligne : une cellule et son noyau. Évite le 404 sur
         /favicon.ico, seul message d'erreur de la console, sans ajouter de
         fichier binaire au dépôt. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230072b2'/%3E%3Ccircle cx='12.5' cy='13' r='5.5' fill='%23f2eee4'/%3E%3Ccircle cx='22' cy='21' r='3' fill='%23d55e00'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --ivoire: #f2eee4;
        --encre: #1c1a17;
        /* Les deux encres secondaires tiennent le minimum WCAG AA de 4,5:1 sur
           l'ivoire : mesuré 5,4:1 et 4,6:1. L'ancienne --encre-3 à 0,38
           plafonnait à 2,28:1, et elle porte les intitulés qui groupent la
           liste des mécanismes — ce ne sont pas des ornements. La hiérarchie
           passe désormais par la graisse et le corps, pas par l'effacement. */
        --encre-2: rgba(28, 26, 23, 0.68);
        --encre-3: rgba(28, 26, 23, 0.62);
        --voile: rgba(242, 238, 228, 0.9);
        --trait: rgba(28, 26, 23, 0.14);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--ivoire);
        color: var(--encre);
        font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      canvas { display: block; }

      /* ── Chargement ─────────────────────────────────────────── */
      #chargement {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        justify-items: center;
        background: var(--ivoire);
        z-index: 50;
        transition: opacity 0.6s ease;
      }
      #chargement.parti { opacity: 0; pointer-events: none; }
      #chargement h1 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
      #chargement p { margin: 0; color: var(--encre-2); font-size: 0.9rem; }
      .jauge { width: 220px; height: 2px; background: var(--trait); overflow: hidden; }
      .jauge i { display: block; height: 100%; width: 30%; background: #0072b2; animation: glisse 1.1s ease-in-out infinite; }
      @keyframes glisse { 0% { transform: translateX(-100%); } 100% { transform: translateX(430%); } }

      /* ── Titre ──────────────────────────────────────────────── */
      #titre {
        position: fixed;
        top: 26px;
        left: 30px;
        max-width: 20rem;
        pointer-events: none;
      }
      #titre h1 {
        margin: 0 0 4px;
        font-size: 1.28rem;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      #titre p { margin: 0; font-size: 0.83rem; color: var(--encre-2); }

      /* ── Colonne de gauche ──────────────────────────────────────
         Les mécanismes et la légende étaient deux blocs `fixed` ancrés l'un en
         haut, l'autre en bas, avec des hauteurs maximales indépendantes : rien
         ne les empêchait de se croiser, et à 752 px de haut ils se
         recouvraient sur 139 px, la légende passant devant six boutons.

         Une colonne bornée en haut ET en bas rend le recouvrement impossible
         par construction. Le `min-height: 0` des enfants est ce qui les
         autorise à descendre sous leur hauteur de contenu et à défiler ; sans
         lui un enfant flex déborde au lieu de se comprimer. */
      #colonne {
        position: fixed;
        left: 30px;
        top: 122px;
        bottom: 26px;
        width: 19rem;
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: none;
      }
      #colonne > * { pointer-events: auto; }

      /* ── Légende ────────────────────────────────────────────── */
      #legende {
        flex: 0 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
        background: var(--voile);
        backdrop-filter: blur(8px);
        border: 1px solid var(--trait);
        border-radius: 9px;
        padding: 9px;
        overflow-y: auto;
      }
      #legende button {
        display: flex;
        align-items: center;
        gap: 9px;
        background: none;
        border: 0;
        border-radius: 6px;
        padding: 6px 9px;
        font: inherit;
        font-size: 0.84rem;
        color: var(--encre);
        cursor: pointer;
        text-align: left;
        min-height: 26px;
        transition: background 0.14s;
      }
      /* `display: flex` ci-dessus l'emporte sur la feuille du navigateur :
         sans cette règle, l'attribut `hidden` ne masque rien. */
      #legende[hidden] { display: none; }
      #legende button:hover { background: rgba(28, 26, 23, 0.07); }
      #legende button[aria-pressed="true"] { background: rgba(28, 26, 23, 0.11); font-weight: 600; }
      #legende button:focus-visible { outline: 2px solid #0072b2; outline-offset: 1px; }
      .pastille {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        flex: none;
        border: 1px solid rgba(28, 26, 23, 0.3);
      }

      /* ── Mécanismes ─────────────────────────────────────────── */
      #flux {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        background: var(--voile);
        backdrop-filter: blur(8px);
        border: 1px solid var(--trait);
        border-radius: 10px;
        padding: 10px;
      }
      #flux h2 {
        margin: 2px 6px 8px;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--encre-3);
        font-weight: 600;
      }
      #flux .siege {
        margin: 9px 6px 3px;
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--encre-3);
      }
      #flux .siege:first-of-type { margin-top: 0; }
      .flux {
        display: flex;
        align-items: baseline;
        gap: 8px;
        width: 100%;
        background: none;
        border: 0;
        border-radius: 6px;
        padding: 5px 8px;
        font: inherit;
        font-size: 0.83rem;
        color: var(--encre);
        cursor: pointer;
        text-align: left;
        min-height: 26px;
        transition: background 0.14s;
      }
      .flux:hover { background: rgba(28, 26, 23, 0.07); }
      .flux[aria-pressed='true'] { background: rgba(0, 114, 178, 0.13); font-weight: 600; }
      .flux:focus-visible { outline: 2px solid #0072b2; outline-offset: 1px; }
      .flux b { font-weight: inherit; flex: 1; }
      .flux .badge {
        font-size: 0.7rem;
        font-variant-numeric: tabular-nums;
        padding: 1px 6px;
        border-radius: 999px;
        background: rgba(28, 26, 23, 0.09);
        color: var(--encre-2);
        white-space: nowrap;
        flex: none;
      }

      #fiche .facteur {
        display: inline-block;
        font-size: 0.72rem;
        font-variant-numeric: tabular-nums;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(0, 114, 178, 0.14);
        color: #005a8f;
        margin-bottom: 10px;
      }
      #fiche .note {
        margin: 0 0 14px;
        padding: 9px 11px;
        border-left: 2px solid rgba(28, 26, 23, 0.18);
        font-size: 0.8rem;
        color: var(--encre-2);
        background: rgba(28, 26, 23, 0.035);
        border-radius: 0 6px 6px 0;
      }
      #fiche .note:empty { display: none; }

      /* ── Étiquette au survol ────────────────────────────────── */
      #survol {
        position: fixed;
        padding: 7px 11px;
        background: var(--encre);
        color: var(--ivoire);
        border-radius: 7px;
        font-size: 0.82rem;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.12s;
        z-index: 20;
        max-width: 17rem;
      }
      #survol.visible { opacity: 1; }
      #survol b { display: block; font-weight: 600; }
      #survol span { color: rgba(242, 238, 228, 0.72); font-size: 0.78rem; }

      /* ── Fiche ──────────────────────────────────────────────── */
      #fiche {
        position: fixed;
        top: 26px;
        right: 30px;
        width: 22rem;
        max-height: calc(100vh - 52px);
        overflow-y: auto;
        background: var(--voile);
        backdrop-filter: blur(10px);
        border: 1px solid var(--trait);
        border-radius: 11px;
        padding: 20px 22px;
        transform: translateX(calc(100% + 40px));
        transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #fiche.ouverte { transform: none; }
      #fiche h2 { margin: 0 0 3px; font-size: 1.08rem; letter-spacing: -0.01em; }
      #fiche .role { margin: 0 0 14px; font-size: 0.84rem; color: var(--encre-2); }
      #fiche .desc { margin: 0 0 16px; font-size: 0.88rem; }
      #fiche .fermer {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 26px;
        height: 26px;
        border: 0;
        border-radius: 50%;
        background: rgba(28, 26, 23, 0.08);
        color: var(--encre);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
      }
      #fiche .fermer:hover { background: rgba(28, 26, 23, 0.16); }

      /* ── Réglages ───────────────────────────────────────────── */
      #reglages {
        position: fixed;
        bottom: 26px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 16px;
        background: var(--voile);
        backdrop-filter: blur(8px);
        border: 1px solid var(--trait);
        border-radius: 999px;
        padding: 10px 20px;
        font-size: 0.83rem;
      }
      #reglages label { display: flex; align-items: center; gap: 9px; color: var(--encre-2); }
      /* 24 px de haut : le minimum de cible tactile de WCAG 2.2 (2.5.8). Les
         curseurs en faisaient 16, et ce sont les deux commandes les plus
         utilisées de la page. */
      #reglages input[type="range"] { width: 130px; height: 24px; accent-color: #0072b2; }
      #reglages .sep { width: 1px; height: 18px; background: var(--trait); }
      #reglages button {
        border: 0;
        background: rgba(28, 26, 23, 0.08);
        border-radius: 999px;
        padding: 5px 13px;
        font: inherit;
        font-size: 0.82rem;
        cursor: pointer;
        min-height: 26px;
      }
      #reglages button:hover { background: rgba(28, 26, 23, 0.16); }

      /* ── Atelier du gène ────────────────────────────────────── */
      #atelier {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        background: var(--voile);
        backdrop-filter: blur(8px);
        border: 1px solid var(--trait);
        border-radius: 10px;
        padding: 14px 15px;
      }
      #atelier[hidden] { display: none; }
      .atelier-entete { display: flex; align-items: baseline; gap: 8px; }
      #atelier h2 { margin: 0; font-size: 0.98rem; letter-spacing: -0.01em; flex: 1; }
      #atelier h3 {
        margin: 16px 0 7px;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--encre-3);
        font-weight: 600;
      }
      .atelier-gene { margin: 3px 0 11px; font-size: 0.8rem; color: var(--encre-2); }

      .atelier-jauge {
        height: 3px;
        background: rgba(28, 26, 23, 0.12);
        border-radius: 999px;
        overflow: hidden;
      }
      .atelier-jauge i {
        display: block;
        height: 100%;
        width: 0;
        background: #0072b2;
        transition: width 0.2s linear;
      }
      .atelier-etape { margin: 10px 0 2px; font-size: 0.88rem; font-weight: 600; }
      .atelier-sous { margin: 0 0 12px; font-size: 0.79rem; color: var(--encre-2); }

      .atelier-boutons { display: flex; flex-wrap: wrap; gap: 6px; }
      #atelier button {
        border: 0;
        background: rgba(28, 26, 23, 0.08);
        border-radius: 999px;
        padding: 6px 13px;
        font: inherit;
        font-size: 0.81rem;
        color: var(--encre);
        cursor: pointer;
        min-height: 30px;
      }
      #atelier button:hover:not(:disabled) { background: rgba(28, 26, 23, 0.16); }
      #atelier button:disabled { opacity: 0.38; cursor: default; }
      #atelier button.primaire:not(:disabled) { background: rgba(0, 114, 178, 0.16); font-weight: 600; }
      #atelier button:focus-visible { outline: 2px solid #0072b2; outline-offset: 1px; }

      /* L'affordance du geste : quand le brin peut être donné, la commande
         respire. Sans elle, rien ne dirait qu'on peut aussi le SAISIR dans la
         scène et le porter jusqu'au ribosome. */
      #atelier.a-donner button.primaire:not(:disabled) {
        animation: respire 1.6s ease-in-out infinite;
      }
      @keyframes respire {
        0%, 100% { background: rgba(0, 114, 178, 0.16); }
        50% { background: rgba(0, 114, 178, 0.34); }
      }
      @media (prefers-reduced-motion: reduce) {
        #atelier.a-donner button.primaire:not(:disabled) { animation: none; }
        .atelier-jauge i { transition: none; }
      }

      .atelier-reglages {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 11px;
        font-size: 0.79rem;
        color: var(--encre-2);
      }
      .atelier-reglages label { display: flex; align-items: center; gap: 7px; }
      .atelier-reglages input[type="range"] { width: 92px; height: 24px; accent-color: #0072b2; }
      .atelier-case input { width: 17px; height: 17px; accent-color: #0072b2; }

      .atelier-lecture {
        margin-top: 12px;
        padding: 9px 11px;
        border-radius: 8px;
        background: rgba(28, 26, 23, 0.05);
        opacity: 0.4;
      }
      .atelier-lecture.active { opacity: 1; background: rgba(0, 114, 178, 0.09); }
      .atelier-lecture .codon {
        font: 600 1.15rem/1.2 ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: 0.16em;
      }
      .atelier-lecture .anti {
        font: 0.72rem/1.4 ui-monospace, "SF Mono", Menlo, monospace;
        color: var(--encre-2);
      }
      .atelier-lecture .residu { font-size: 0.83rem; margin-top: 3px; }

      .atelier-sequence { display: flex; flex-wrap: wrap; gap: 3px; }
      .atelier-sequence .residu {
        width: 19px;
        height: 19px;
        display: grid;
        place-content: center;
        border-radius: 4px;
        font: 600 0.68rem/1 ui-monospace, "SF Mono", Menlo, monospace;
        background: rgba(28, 26, 23, 0.07);
        color: var(--encre-3);
        border: 1px solid transparent;
      }
      /* Un résidu posé prend la teinte de sa CLASSE chimique, jamais la sienne :
         vingt teintes ne seraient discriminables par personne, et ce qui décide
         du repliement est l'alternance des caractères. */
      .atelier-sequence .residu.pose { color: #fff; border-color: rgba(0, 0, 0, 0.12); }
      .residu.pose.apolaire { background: #e69f00; color: #1c1a17; }
      .residu.pose.polaire { background: #56b4e9; color: #1c1a17; }
      .residu.pose.basique { background: #0072b2; }
      .residu.pose.acide { background: #d55e00; }

      .atelier-classes {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
        font-size: 0.71rem;
        color: var(--encre-2);
      }
      .atelier-classes .classe { display: flex; align-items: center; gap: 5px; }
      .atelier-classes i { width: 9px; height: 9px; border-radius: 2px; }
      .atelier-classes i.apolaire { background: #e69f00; }
      .atelier-classes i.polaire { background: #56b4e9; }
      .atelier-classes i.basique { background: #0072b2; }
      .atelier-classes i.acide { background: #d55e00; }

      .atelier-bilan {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 3px 12px;
        margin: 0;
        font-size: 0.79rem;
      }
      .atelier-bilan dt { color: var(--encre-2); }
      .atelier-bilan dd { margin: 0; font-variant-numeric: tabular-nums; }
      #atelier.a-court .atelier-bilan dd { color: #b35400; }
      #atelier.a-sec .atelier-bilan dd { color: #d55e00; font-weight: 600; }

      .atelier-leviers { display: flex; flex-wrap: wrap; gap: 6px; }
      #atelier button.levier[aria-pressed="true"] {
        background: rgba(213, 94, 0, 0.22);
        font-weight: 600;
      }
      .atelier-explication {
        margin: 9px 0 0;
        font-size: 0.77rem;
        color: var(--encre-2);
        line-height: 1.5;
      }
      .atelier-explication:empty { display: none; }

      .atelier-note {
        margin: 12px 0 0;
        padding: 8px 10px;
        border-left: 2px solid rgba(28, 26, 23, 0.18);
        font-size: 0.74rem;
        color: var(--encre-2);
        background: rgba(28, 26, 23, 0.035);
        border-radius: 0 6px 6px 0;
      }

      #echelle {
        position: fixed;
        right: 30px;
        bottom: 26px;
        font-size: 0.78rem;
        color: var(--encre-2);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      #echelle .barre {
        height: 2px;
        background: var(--encre);
        margin-bottom: 5px;
        margin-left: auto;
      }

      @media (max-width: 900px) {
        #fiche { width: auto; left: 16px; right: 16px; top: auto; bottom: 96px; max-height: 46vh; }
        #fiche.ouverte { transform: none; }
        #fiche:not(.ouverte) { transform: translateY(calc(100% + 120px)); }
        #colonne { left: 16px; right: 16px; width: auto; top: 96px; bottom: 90px; }
        #titre { left: 16px; top: 16px; }
        #echelle { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="chargement">
      <h1>La cellule</h1>
      <div class="jauge"><i></i></div>
      <p>Assemblage des organites…</p>
    </div>

    <header id="titre">
      <h1>La cellule</h1>
      <p>Écorché d'une cellule eucaryote animale. Survolez un organite pour l'identifier, cliquez pour la fiche.</p>
    </header>

    <div id="colonne">
      <section id="flux" aria-label="Processus vivants"></section>
      <nav id="legende" aria-label="Organites"></nav>
    </div>

    <div id="survol" role="status" aria-live="polite"></div>

    <aside id="fiche" aria-live="polite">
      <button class="fermer" aria-label="Fermer la fiche">✕</button>
      <h2></h2>
      <p class="role"></p>
      <span class="facteur"></span>
      <p class="desc"></p>
      <p class="note"></p>
    </aside>

    <div id="reglages">
      <label>
        Densité
        <input id="densite" type="range" min="0" max="100" value="100" aria-label="Densité moléculaire affichée" />
      </label>
      <span class="sep"></span>
      <label>
        Écorché
        <input id="coupe" type="range" min="0" max="100" value="58" aria-label="Ouverture de l'écorché" />
      </label>
      <span class="sep"></span>
      <button id="ouvrirAtelier" aria-pressed="false">Atelier du gène</button>
      <button id="verite">Boîte de vérité</button>
      <button id="rotation" aria-pressed="true">Rotation</button>
      <button id="recadrer">Recadrer</button>
    </div>

    <div id="echelle">
      <div class="barre" style="width: 90px"></div>
      <span id="echelleTexte">— µm</span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
